<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit a ticket &middot; TicketTriage</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <div class="brand">Ticket<span>Triage</span></div>
    <nav class="site">
      <a href="/index.html" class="active">Submit a ticket</a>
      <a href="/admin.html">Admin review</a>
    </nav>
  </div>
</header>

<main>
  <div class="card">
    <h1>Submit a support ticket</h1>
    <p class="subtitle">Tell us what's going on and we'll route it to the right team.</p>

    <form id="ticketForm">
      <label for="name">Name</label>
      <input type="text" id="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="title">Title</label>
      <input type="text" id="title" required placeholder="Short summary of the issue">

      <label for="description">Description</label>
      <textarea id="description" placeholder="Any extra detail that helps us understand the issue"></textarea>

      <label for="priority">Priority</label>
      <select id="priority">
        <option value="Low">Low</option>
        <option value="Medium" selected>Medium</option>
        <option value="High">High</option>
      </select>

      <button type="submit">Submit ticket</button>
      <div id="formMessage"></div>
    </form>
  </div>
</main>

<script src="/js/app.js"></script>
</body>
</html>
